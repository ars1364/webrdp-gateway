name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only token unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  SYFT_IMAGE: anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  guards:
    name: mechanical guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/file-size.sh
      - run: scripts/ci/handler-tests.sh
      - run: scripts/ci/migrations.sh
      - run: scripts/ci/docs-drift.sh
      - run: scripts/ci/airgap.sh
      - run: scripts/ci/backend-rules.sh

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose --exit-code 1

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache-dependency-path: backend/go.sum }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./... && go vet -tags=integration ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  integration:
    name: postgres integration (migrations up/down, isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: webrdp_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable, cache-dependency-path: backend/go.sum }
      - run: go test -tags=integration -count=1 -p 1 -v ./internal/store/
        env: { TEST_DATABASE_URL: "postgres://postgres:ci@localhost:5432/webrdp_test?sslmode=disable" }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  trivy-fs:
    name: trivy (deps, misconfig, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --scanners vuln,misconfig,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-dirs /src/frontend/node_modules /src

  third-party-images:
    name: trivy (third-party runtime images, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # postgres/guacd are upstream images we don't build: report, don't gate.
      # Dependabot bumps their digests; review this output on every bump.
      - run: |
          for img in $(grep -oE 'image: [a-z][^$ ]+@sha256:[a-f0-9]+' deploy/docker-compose.yml | awk '{print $2}'); do
            docker run --rm "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --quiet "$img"
          done

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/src" "$SYFT_IMAGE" dir:/src -o spdx-json=/src/sbom-source.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom-source, path: sbom-source.spdx.json }

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [guards, secrets, backend, integration, frontend, trivy-fs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: web, context: frontend }
    env:
      IMAGE: ghcr.io/ars1364/webrdp-gateway-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:scan"
      - name: image SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$SYFT_IMAGE" "$IMAGE:scan" -o spdx-json=/out/sbom-${{ matrix.name }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "sbom-${{ matrix.name }}", path: "sbom-${{ matrix.name }}.spdx.json" }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: push (with SBOM + provenance attestations)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
